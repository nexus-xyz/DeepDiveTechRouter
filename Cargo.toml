[package]
name = "nexus-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Black-box mock upstream + chaos auditor for the Nexus AI Router technical interview"
publish = false

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tokio-stream = "0.1"
bytes = "1.6"
uuid = { version = "1.8", features = ["v4"] }
rand = "0.8"
colored = "2.1"
parking_lot = "0.12"
